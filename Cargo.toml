[package]
name = "kstory"
version = "0.1.0"
edition = "2021"
description = "Portable KStory content authoring, localization catalog editor and translation workflow"

[features]
default = []
legacy-egui = ["dep:eframe"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dioxus = { version = "0.7.10", features = ["desktop"] }
dirs = "6.0"
eframe = { version = "0.29", optional = true }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.12"
